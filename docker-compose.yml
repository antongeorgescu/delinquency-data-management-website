version: "3.9"

services:
  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    container_name: delinquency-api
    environment:
      - DB_PATH=/data/student_loan_data.db
    volumes:
      # Persist SQLite database across container restarts
      - db-data:/data
    ports:
      - "5000:5000"
    restart: unless-stopped

  web:
    build:
      context: ./src/web
      dockerfile: Dockerfile
    container_name: delinquency-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
